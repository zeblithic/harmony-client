name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older in-flight runs when a new commit lands on the same PR/branch.
# Saves CI minutes and gets the latest commit's feedback to the author faster.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Least-privilege GITHUB_TOKEN: this workflow only checks out code and runs
# local validation commands — it never writes to the repo, opens PRs, posts
# comments, or pushes packages. Locking to read-only here means a compromised
# action or step can't escalate beyond what CI legitimately needs.
permissions:
  contents: read

# All third-party actions are pinned to full commit SHAs (not moving tags) so
# a compromised upstream or moved tag can't silently change what runs in CI.
# The trailing comment names the original tag for auditability — bump both
# together when refreshing.

jobs:
  # ZEB-273: split from the previous monolithic `rust` job. fmt + clippy run
  # here; tests run in parallel in `rust-test`. Wall-clock for the rust side
  # of CI drops from ~10 min (sequential fmt → clippy → test) to ~5 min
  # (longest-pole of clippy vs nextest), at the cost of ~80% more CI minutes.
  # Engineer wall-clock dominates over runner-minute cost.
  rust-check:
    name: Rust — fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # Shared with release.yml via composite action — single source of
      # truth for the system libs tauri-runtime-wry's Linux backend pulls
      # in transitively (gdk-sys, webkit2gtk-sys, libsoup-sys, etc).
      - name: Install Tauri Linux deps
        uses: ./.github/actions/install-linux-tauri-deps

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Per-job cache key so rust-check and rust-test don't trample each
      # other's compile artifacts. They share the deps cache (Cargo.lock-keyed)
      # but keep their own check-mode vs test-binary outputs.
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          workspaces: src-tauri
          key: check
          # ZEB-440: main-only cache saves — see the rust-test job's
          # rust-cache step for the full rationale.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      # `--all-targets` is load-bearing: it builds tests/benches/examples,
      # not just the lib. Without it, integration test compile errors slip
      # through merge — exactly how ZEB-164's SidecarId migration broke
      # tests/content_index_integration.rs and tests/folder_primitive_integration.rs
      # but main stayed "green" for two days because contributors only
      # ran `cargo test --lib` locally.
      #
      # `--locked` ensures we test against the exact Cargo.lock dep graph
      # the repo committed. Without it, cargo can silently re-resolve
      # patched/yanked deps and CI would be testing a different graph than
      # contributors run locally. The MSRV job already uses --locked; the
      # main gate should match.
      # `--features test-fixtures` is required so the integration test
      # `tests/wire_format_channel_log_fixtures.rs` can compile — it
      # uses `encrypt_channel_packet_with_nonce`, a deterministic-nonce
      # variant of the production AEAD helper that is `#[cfg]`-gated to
      # `any(test, feature = "test-fixtures")` so it cannot be reached
      # from a release build (production code MUST use the random-nonce
      # `encrypt_channel_packet`; the deterministic variant is a
      # pin-test footgun if accidentally called). Integration tests
      # compile against the crate's public API and cannot see
      # `#[cfg(test)]`-only items, hence the feature gate.
      #
      # `--no-deps` keeps clippy focused on our own crate — third-party
      # dep lints are noise we can't fix.
      - name: cargo clippy --locked --all-targets
        run: cargo clippy --locked --all-targets --features test-fixtures --no-deps -- -D warnings

  rust-test:
    name: Rust — test (nextest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # ZEB-440: this is the only job that LINKS — 113+ integration-test
      # binaries at ~90-108 MB each (line-tables-only debuginfo since ZEB-304,
      # statically-linked lib) ≈ 10-12 GB of executables per build generation,
      # before counting the
      # restored dep cache. The stock ubuntu-latest image leaves only
      # ~20 GB free, and June-2026 workspace growth (lib.rs +24%, test
      # files +19% in ten days) pushed peak usage past it: deterministic
      # ENOSPC at link, killing the job ~4.5 min in. Reclaim ~15-25 GB by
      # deleting preinstalled toolsets this repo never uses. Plain `rm -rf`
      # instead of a third-party free-disk action keeps the SHA-pinning
      # policy intact; rm -rf on absent paths is a no-op, so runner-image
      # layout changes degrade gracefully (telemetry below shows when the
      # reclaim stops paying). df output is the headroom trendline — read
      # it before adding the next 20 test binaries.
      - name: Reclaim runner disk (ZEB-440)
        run: |
          echo "=== disk before reclaim ==="
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "=== disk after reclaim ==="
          df -h /

      - name: Install Tauri Linux deps
        uses: ./.github/actions/install-linux-tauri-deps

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # master
        with:
          toolchain: stable

      # ZEB-273: cargo-nextest is a faster test runner than `cargo test`.
      # Common 30-60% speedup on workspaces because it parallelizes test
      # execution at the binary level (cargo test parallelizes within a
      # binary but runs binaries sequentially by default). The
      # taiki-e/install-action installs a precompiled binary in ~5 sec
      # instead of `cargo install cargo-nextest` taking ~3 min.
      - uses: taiki-e/install-action@ec28e287910af896fd98e04056d31fa68607e7ad  # v2.77.4
        with:
          tool: cargo-nextest

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          workspaces: src-tauri
          key: test
          # ZEB-440: only main updates the cache. PR-branch saves (~1.1 GB
          # compressed per round for this key) had pushed the repo past its
          # 10 GB Actions-cache quota into LRU eviction churn. PR runs
          # still RESTORE main's cache; they rebuild workspace crates on
          # top, which any lib-touching PR does anyway.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # nextest doesn't run doctests (`cargo test --doc` is the separate
      # doctest gate). At the time of writing, src-tauri has zero active
      # Rust doctests (the only fenced doc-block in src/follows.rs is
      # ```json, which doesn't compile as a doctest), so dropping cargo
      # test in favor of nextest is loss-free coverage-wise. If the
      # project gains Rust doctests later, add a `cargo test --doc` step
      # to this job before relying on nextest as the sole test gate.
      # ZEB-397: the depth-2+ nested-bundle round-trip
      # (`nested_bundle_tree_round_trip`) used to need a dedicated
      # `rust-test-large` job (HARMONY_LARGE_TESTS=1, 60-min timeout) because
      # it forced depth-2 by hashing a 36 GiB sparse file (~17 min) — the
      # per-PR CI long pole. It now forces the identical depth-2 path
      # (leaf count > MAX_BUNDLE_ENTRIES) with a tiny chunker config + a
      # ~140 MiB sparse fixture that runs in well under a second, so it is
      # un-gated and runs right here under --all-targets on every PR.
      - name: cargo nextest run --workspace --all-targets
        run: cargo nextest run --locked --workspace --all-targets --features test-fixtures --no-fail-fast

      # ZEB-440 telemetry: residual usage after build + tests. When the
      # "Avail" number here trends below ~10 GB, the disk cliff is close
      # again — reach for the next lever (debuginfo trim / binary
      # consolidation) BEFORE it starts killing runs.
      - name: Disk headroom after tests
        if: always()
        run: df -h /

  # Validates `rust-version` declared in src-tauri/Cargo.toml. The `rust-check`
  # job above runs on stable for newer clippy lints + fastest iteration; this
  # job runs `cargo check --locked --all-targets` on the declared MSRV so
  # accidental use of post-MSRV Rust features (or a transitive dep that
  # raises its own MSRV) is caught at PR review, not at first compile on a
  # contributor's pinned-toolchain box. `check` (not `test`) keeps the job
  # fast — MSRV regressions surface as compile errors. `--locked` ensures we
  # test against the actual Cargo.lock dep graph, not whatever resolves
  # fresh.
  #
  # The MSRV value comes from a single source of truth — Cargo.toml's
  # `rust-version` — extracted at job time. This means a bump in Cargo.toml
  # automatically retargets the gate, no second edit required.
  msrv:
    name: MSRV — cargo check on declared rust-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install Tauri Linux deps
        uses: ./.github/actions/install-linux-tauri-deps

      # Use cargo's own TOML parser via `cargo metadata` so single-quoted
      # strings, multi-line definitions, and any other valid TOML form all
      # parse correctly — a regex against Cargo.toml would not. `--no-deps`
      # skips dep resolution so this is a fast local-manifest read.
      # `cargo` is preinstalled on the GitHub-hosted ubuntu runner image,
      # so this step runs before any toolchain install.
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          set -uo pipefail
          msrv=$(cargo metadata --no-deps --format-version 1 --manifest-path Cargo.toml | jq -r '.packages[0].rust_version' || echo '')
          if [ -z "$msrv" ] || [ "$msrv" = "null" ]; then
            echo "::error::Cargo.toml has no [package].rust-version field; the MSRV gate has nothing to enforce" >&2
            exit 1
          fi
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"
          echo "Resolved MSRV from Cargo.toml: $msrv"

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # master
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          workspaces: src-tauri
          key: msrv
          # ZEB-440: main-only cache saves — see the rust-test job's
          # rust-cache step for the full rationale.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # See the rust-check job's clippy step for why `--features
      # test-fixtures` is required to compile `--all-targets`.
      - name: cargo check --locked --all-targets
        run: cargo check --locked --all-targets --features test-fixtures

  frontend:
    name: Frontend — tsc, vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: tsc --noEmit
        run: npx tsc --noEmit

      - name: vitest
        run: npx vitest run
