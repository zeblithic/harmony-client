name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux build needs WebKit/GTK system libraries even when
      # only the Rust side is being built/tested — the tauri crate's build
      # script links against them at compile time.
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      # `--all-targets` is load-bearing: it builds tests/benches/examples,
      # not just the lib. Without it, integration test compile errors slip
      # through merge — exactly how ZEB-164's SidecarId migration broke
      # tests/content_index_integration.rs and tests/folder_primitive_integration.rs
      # but main stayed "green" for two days because contributors only
      # ran `cargo test --lib` locally.
      - name: cargo clippy --all-targets
        run: cargo clippy --all-targets --no-deps

      - name: cargo test --workspace
        run: cargo test --workspace

  frontend:
    name: Frontend — tsc, vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: tsc --noEmit
        run: npx tsc --noEmit

      - name: vitest
        run: npx vitest run
