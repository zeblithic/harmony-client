name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older in-flight runs when a new commit lands on the same PR/branch.
# Saves CI minutes and gets the latest commit's feedback to the author faster.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux build needs WebKit/GTK system libraries even when
      # only the Rust side is being built/tested — the tauri crate's build
      # script links against them at compile time.
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      # `--all-targets` is load-bearing: it builds tests/benches/examples,
      # not just the lib. Without it, integration test compile errors slip
      # through merge — exactly how ZEB-164's SidecarId migration broke
      # tests/content_index_integration.rs and tests/folder_primitive_integration.rs
      # but main stayed "green" for two days because contributors only
      # ran `cargo test --lib` locally.
      - name: cargo clippy --all-targets
        run: cargo clippy --all-targets --no-deps

      - name: cargo test --workspace
        run: cargo test --workspace

  # Validates `rust-version` declared in src-tauri/Cargo.toml. The `rust` job
  # above runs on stable for newer clippy lints + fastest iteration; this job
  # runs `cargo check --all-targets` on the declared MSRV so accidental use of
  # post-1.75 Rust features is caught at PR review, not at first compile on a
  # contributor's pinned-toolchain box. `check` (not `test`) keeps the job
  # fast — MSRV regressions surface as compile errors, not test failures.
  msrv:
    name: MSRV — cargo check on declared rust-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            build-essential

      - uses: dtolnay/rust-toolchain@1.75

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: msrv

      - name: cargo check --all-targets
        run: cargo check --all-targets

  frontend:
    name: Frontend — tsc, vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: tsc --noEmit
        run: npx tsc --noEmit

      - name: vitest
        run: npx vitest run
