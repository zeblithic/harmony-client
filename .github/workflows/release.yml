name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer + pre-release (e.g., 0.1.0-alpha.1)'
        required: true
        type: string

permissions:
  contents: write    # for gh release create + gh-pages push

jobs:
  precheck:
    name: Precheck (version match + gates + tag clear)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Confirm version input matches tauri.conf.json
        run: |
          CONFIG_VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$CONFIG_VERSION" != "${{ inputs.version }}" ]; then
            echo "::error::version mismatch: input=${{ inputs.version }} config=$CONFIG_VERSION"
            echo "Bump tauri.conf.json version + commit before triggering."
            exit 1
          fi

      - name: Confirm tag does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ inputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::release v${{ inputs.version }} already exists"
            exit 1
          fi

      - name: Install Rust toolchain (honors rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: npm ci
        run: npm ci

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets --features test-fixtures --no-deps -- -D warnings

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked

      - name: cargo nextest
        working-directory: src-tauri
        run: cargo nextest run --locked --workspace --all-targets --features test-fixtures

      - name: tsc --noEmit
        run: npx tsc --noEmit

      - name: vitest
        run: npx vitest run

  build:
    name: Build (${{ matrix.os }})
    needs: precheck
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libsoup-3.0-dev javascriptcoregtk-4.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: npm ci
        run: npm ci

      - name: tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Sanity-check artifact presence
        shell: bash
        run: |
          set -euo pipefail
          ls -la src-tauri/target/${{ matrix.target }}/release/bundle/ || true
          find src-tauri/target/${{ matrix.target }}/release/bundle/ -name "*.sig" | head -1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.zip
          if-no-files-found: warn

  release:
    name: Create draft GitHub Release with per-platform artifacts
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      # ZEB-328 PR #160 R1 (Cursor HIGH): keep per-platform subdirectories
      # so the macOS ARM (`Harmony.app.tar.gz`) and macOS Intel
      # (`Harmony.app.tar.gz`) updater bundles don't collide on basename
      # during the flatten step. The operator-side manifest generator
      # (documented in docs/release-process.md §2) reads
      # artifacts/bundle-{target}/... directly to disambiguate them.
      - name: Rename macOS updater bundles per-arch (avoid name collision)
        run: |
          set -euo pipefail
          # Tauri names both macOS updater bundles `Harmony.app.tar.gz`;
          # rename in place to include the target triple so subsequent
          # release-asset upload + operator manifest gen can disambiguate.
          for d in artifacts/bundle-aarch64-apple-darwin artifacts/bundle-x86_64-apple-darwin; do
            if [ -d "$d" ]; then
              arch=$(basename "$d" | sed 's/bundle-//')
              if [ -f "$d/Harmony.app.tar.gz" ]; then
                mv -v "$d/Harmony.app.tar.gz" "$d/Harmony_${arch}.app.tar.gz"
              fi
              if [ -f "$d/Harmony.app.tar.gz.sig" ]; then
                mv -v "$d/Harmony.app.tar.gz.sig" "$d/Harmony_${arch}.app.tar.gz.sig"
              fi
            fi
          done

      - name: Stage release files (per-platform subdirs preserved)
        run: |
          set -euo pipefail
          mkdir -p release-files
          # Now safe to flatten — every basename is unique post-rename.
          # ZEB-328 PR #160 R1 (Qodo): cp -f to avoid any interactive
          # prompt in a non-interactive workflow.
          find artifacts/ -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.AppImage" -o -name "*.tar.gz" -o -name "*.sig" -o -name "*.zip" \) -exec cp -f {} release-files/ \;
          ls -la release-files/

      # ZEB-328 PR #160 R1 (Qodo MED): fail loudly if any expected
      # platform's updater bundle didn't make it through the build.
      # Catches matrix-job silent failures (one OS green-passes but
      # produces no bundle due to bundler misconfig) BEFORE we ship a
      # broken release.
      - name: Verify all platform bundles present
        run: |
          set -euo pipefail
          required=(
            "Harmony_aarch64-apple-darwin.app.tar.gz"
            "Harmony_aarch64-apple-darwin.app.tar.gz.sig"
            "Harmony_x86_64-apple-darwin.app.tar.gz"
            "Harmony_x86_64-apple-darwin.app.tar.gz.sig"
          )
          missing=()
          for f in "${required[@]}"; do
            if [ ! -f "release-files/$f" ]; then
              missing+=("$f")
            fi
          done
          # Windows + Linux updater bundle basenames vary by version, glob-check them:
          for glob in '*-setup.nsis.zip' '*-setup.nsis.zip.sig' '*amd64.AppImage.tar.gz' '*amd64.AppImage.tar.gz.sig'; do
            if ! ls release-files/$glob >/dev/null 2>&1; then
              missing+=("$glob")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing expected release artifacts:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi
          echo "All expected platform bundles present."

      - name: Create draft GitHub Release (operator publishes after smoke test)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --generate-notes \
            --draft \
            release-files/*

      # ZEB-328 PR #160 R1 (Cursor MED): the workflow stops at "draft
      # release created". Operator (zeblith) is responsible for the
      # manual smoke test on each platform per docs/release-process.md
      # §3 BEFORE running the manifest update + un-draft commands
      # documented in docs/release-process.md §2. Auto-publishing
      # before smoke-test risks shipping a broken auto-update path to
      # all installed clients within the ~30s GitHub-Pages refresh.
