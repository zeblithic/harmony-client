# Composite action: install the system libraries that tauri-runtime-wry's
# Linux backend pulls in transitively (gdk-sys, webkit2gtk-sys,
# javascriptcoregtk-sys, libsoup-sys, etc.). Used by both `precheck` and
# `build` jobs in release.yml — single source of truth prevents drift
# between the two (the prior in-line duplication caused exactly that:
# both copies carried an invalid `javascriptcoregtk-4.1` package name,
# but only the precheck failure surfaced because the build job never
# ran).
#
# Package notes:
#   - libgtk-3-dev          → provides gdk-3.0.pc (gdk-sys)
#   - libwebkit2gtk-4.1-dev → provides webkit2gtk-4.1.pc (webkit2gtk-sys)
#   - libayatana-appindicator3-dev → tray-icon backend (tao/wry pull this)
#   - librsvg2-dev          → SVG rasterizer used by Tauri's icon pipeline
#   - libssl-dev            → reqwest/native-tls transitive
#   - libsoup-3.0-dev       → libsoup-sys (webkit2gtk's HTTP backend)
#   - libjavascriptcoregtk-4.1-dev → JS engine bindings (transitively
#     required by libwebkit2gtk; explicit add is belt-and-suspenders,
#     and uses the actual package name — the pre-fix value
#     `javascriptcoregtk-4.1` was not a valid apt package on Ubuntu 22.04,
#     caught by Cursor on PR #165).
name: 'Install Linux Tauri build deps'
description: 'Installs GTK + WebKit + ayatana-appindicator + librsvg + libsoup + javascriptcoregtk dev libraries for tauri-runtime-wry on Ubuntu.'

runs:
  using: 'composite'
  steps:
    - name: apt-get install Tauri Linux deps
      shell: bash
      run: |
        # ZEB-498: a hung/throttled apt mirror has made this step run up to
        # 45 min and blow the CI job timeout (observed on PR #287, where apt
        # alone consumed the whole 45-min budget before clippy even started).
        # Cap per-connection timeouts so a bad mirror fails fast, and retry the
        # whole update+install up to 3x with an 8-min per-attempt wall-clock cap
        # instead of hanging. Worst case 3x8m=24m << the job timeout, vs an
        # unbounded hang.
        #
        # 0.2.8 cut (run 32210904051): `timeout -k 10s` kills only the direct
        # `bash -c` child — the `sudo apt-get` GRANDCHILD survives as an orphan
        # still holding /var/lib/dpkg/lock-frontend, so attempts 2 and 3 failed
        # instantly on "could not get lock (held by <attempt-1's apt>)" and the
        # retry loop was useless in exactly the slow-mirror case it exists for.
        # Two-part fix: reap the whole apt/dpkg subtree between attempts (then
        # repair any interrupted-dpkg state), and give apt DPkg::Lock::Timeout
        # so a retry WAITS on a lingering lock instead of failing on sight.
        set -uo pipefail
        run_apt() {
          sudo apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=120 \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=120 \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
        }
        export -f run_apt
        for attempt in 1 2 3; do
          echo "apt deps install — attempt $attempt"
          if timeout -k 10s 480 bash -c 'set -e; run_apt'; then
            echo "Tauri Linux deps installed on attempt $attempt"
            exit 0
          fi
          echo "::warning::apt attempt $attempt failed or timed out (>8m); retrying in 15s"
          # Reap any apt/dpkg orphaned by the timeout — `timeout` cannot reach
          # the sudo grandchild, and a survivor holds the dpkg lock forever.
          sudo pkill -9 -x apt-get 2>/dev/null || true
          sudo pkill -9 -x dpkg 2>/dev/null || true
          sleep 2
          # A kill mid-unpack can leave dpkg interrupted; repair before retrying
          # (no-op when the kill landed during the download phase).
          sudo dpkg --configure -a 2>/dev/null || true
          sleep 13
        done
        echo "::error::Tauri Linux deps install failed after 3 attempts"
        exit 1
