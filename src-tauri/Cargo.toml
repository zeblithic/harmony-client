[package]
name = "harmony-app"
version = "0.1.0"
description = "Harmony Network Client"
authors = ["zeblithic"]
edition = "2021"
rust-version = "1.91"

# ZEB-548 Stage 0: src-tauri is now the workspace root. New library crates live
# under crates/*; harmony-app remains the bin/cdylib here. [patch.crates-io] and
# [profile.*] stay in THIS file because Cargo honors them only at the workspace
# root.
[workspace]
members = ["crates/*"]
resolver = "2"

# harmony-* git deps shared across workspace members live here so their lockstep
# rev (reference_harmony_dep_lockstep_rev_bump) lives in ONE place and cannot
# drift between crates. harmony-app-only harmony-* deps stay inline in
# [dependencies] below; migrate them here as later stages make them shared.
[workspace.dependencies]
harmony-identity = { git = "https://github.com/zeblithic/harmony.git", rev = "777a5c007c076d96840c9a3b012a028ea3d17a3e" }
harmony-content = { git = "https://github.com/zeblithic/harmony.git", rev = "777a5c007c076d96840c9a3b012a028ea3d17a3e" }
harmony-crdt-sync = { git = "https://github.com/zeblithic/harmony.git", rev = "777a5c007c076d96840c9a3b012a028ea3d17a3e" }
# harmony-owner + harmony-reachability are shared because harmony-core-types
# certifies their wire types (OwnerState, ReachabilityAnnouncePayload) as
# CanonicalPayload — those impls must live with the trait (orphan rule), so both
# crates pin the same rev from here. harmony-app adds the `recovery` feature.
harmony-owner = { git = "https://github.com/zeblithic/harmony.git", rev = "777a5c007c076d96840c9a3b012a028ea3d17a3e" }
harmony-reachability = { git = "https://github.com/zeblithic/harmony.git", rev = "777a5c007c076d96840c9a3b012a028ea3d17a3e" }
# ZEB-548 Stage 1 (PR #3): harmony-crypto is now shared — harmony-identity-crypto
# uses `password_envelope` (identity vault sealing) and harmony-app still uses
# `hash::truncated_hash` in the other clusters — so its rev lives here for
# lockstep. Consumers add the `password-envelope` feature.
harmony-crypto = { git = "https://github.com/zeblithic/harmony.git", rev = "777a5c007c076d96840c9a3b012a028ea3d17a3e" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# `test-fixtures` exposes test-only helpers (deterministic-nonce
# encrypt, etc.) to integration tests in `tests/*.rs`. Integration
# tests compile against the crate's public API, so `#[cfg(test)]`
# alone won't reach them — that gate only fires for inside-the-crate
# tests. Helpers gated on `test-fixtures` are physically excluded from
# release builds; the CI lib + workspace cargo invocations enable the
# feature to keep wire-format pin tests compilable. NEVER enable in a
# production build — see `community_channel_log::encrypt_channel_packet_with_nonce`
# for the nonce-reuse footgun this gate guards.
#
# Enables `tauri/test` so lib-side fixtures that build a mock app/context
# (e.g. `mock_context_with_full_acl`) compile with just `--features
# test-fixtures`, not only under `--all-targets` (where the dev-dependency
# would otherwise pull `tauri/test` in via feature unification).
# harmony-identity-crypto/test-fixtures propagates the same gate to the extracted
# identity tier (ZEB-548 PR #3), so its `identity::test_only::*_for_test` seams
# stay reachable from harmony-app's wire-format integration tests.
test-fixtures = ["tauri/test", "harmony-identity-crypto/test-fixtures"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
serde_bytes = "0.11"
ciborium = "0.2"
# Default features include TCP, UDP, QUIC, TLS, WebSocket transports.
# A desktop app benefits from all transports. Disabling defaults breaks
# TCP connectivity (previous review confirmed this).
# ZEB-373: pinned exact because we depend on zenoh's `internal` (unstable) surface
# — `internal::runtime::{RuntimeBuilder, Runtime}` + `session::init`. A semver-minor
# bump could change that surface and break the build, so upgrades are deliberate
# (bump this pin + re-verify the swap). Matches the vendored zenoh-link 1.9.0 fork.
# (Qodo, PR #190.)
# ZEB-620: "unstable" exposes transport/link event listeners for the reconnect supervisor.
zenoh = { version = "=1.9.0", features = ["internal", "unstable"] }
# ZEB-321 Phase 1 Task 5: zenoh's pluggable transport surface lives in
# zenoh-link (LinkUnicastTrait, LinkAuthId, BatchSize, Locator) and
# zenoh-result (ZResult, zerror!). Both are transitive deps of zenoh
# itself, but cargo requires an explicit entry to import from them
# directly. Pinned to "1" to track zenoh's major version; resolves
# to the same versions Cargo.lock pins for the transitive copies.
zenoh-link = "1"
zenoh-result = "1"
# Needed for `BatchSize` (used in `LinkUnicastTrait::get_mtu`'s return
# type). `BatchSize` is `pub type BatchSize = u16` in zenoh-protocol's
# transport module — zenoh-link does not re-export it, so we depend on
# zenoh-protocol directly.
zenoh-protocol = "1"
# ZEB-321 Phase 1 Task 6: `NewLinkChannelSender = flume::Sender<LinkUnicast>`
# is zenoh-link's outbound-new-link mechanism (see
# `zenoh-link-commons::unicast`). Constructing `IrohZenohLinkManager`
# requires a flume sender, so we pull `flume` in directly rather than
# leaning on the transitive copy zenoh re-exports privately. Pinned to
# "0.11" — matches the version zenoh-link-commons 1.8 resolves to.
flume = "0.11"
# ZEB-445 serve mode adds: "rt-multi-thread" (serve_cli builds its own
# multi-thread runtime), "macros" (tokio::select! in the shutdown path),
# "signal" (ctrl-c / SIGTERM handling in wait_for_exit_signal).
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "signal", "io-util"] }
# ZEB-473 (DM-over-iroh, Move 1a): the tunnel session loop reads length-prefixed
# frames off the iroh bi-stream inside a `tokio::select!`; `FramedRead` +
# `LengthDelimitedCodec` buffers partial reads internally so a cancelled read
# future (when another select arm fires) does not discard consumed bytes. Already
# in the lock transitively (iroh/zenoh); a direct entry makes the codec importable.
tokio-util = { version = "0.7", features = ["codec"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
futures = "0.3"
hex = "0.4"
rand = "0.8"
rand_chacha = "0.3"
zeroize = { version = "1", features = ["derive"] }
ulid = { version = "1", features = ["serde"] }
tracing = "0.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Harmony crates — harmony-runtime is the core sans-I/O runtime.
# harmony-identity and harmony-content are direct deps because we use
# their types (PrivateIdentity, PqPrivateIdentity, MemoryBookStore, etc.).
# Pinned to harmony main cb05de92 (ZEB-739, harmony#291): the iroh-tier
# extraction — adds the harmony-iroh + harmony-tunnel-iroh crates (the
# reusable iroh endpoint/dispatch substrate + PQ tunnel manager/driver that
# iroh_endpoint.rs / tunnel_manager.rs / tunnel_task.rs now delegate to) and
# bumps the core workspace to iroh 1.0 (un-forking harmony-node). A descendant
# of 488a58bf (ZEB-738, harmony#290): adds
# harmony_crypto::{x25519, sealed_box} — the ed25519↔x25519 conversions +
# anonymous-sender sealed box that dm_signing.rs now delegates to; harmony-owner
# re-exports the same conversion, retiring the "must stay byte-compatible"
# duplication. A descendant of 882f9fd7 (ZEB-737, harmony#289): adds the
# harmony-crdt-sync crate (the backfill/backoff latches that
# channel_backfill now delegates to). A descendant of cde0726 (ZEB-736,
# harmony#287), which added harmony_crypto::capability (the generic
# capability-proof primitive open_join_auth delegates to); itself a
# descendant of 5665bcf (ZEB-411,
# harmony#286) — OwnerState's local quorum walk-backs (add_enrollment /
# add_revocation) and enroll_via_quorum reject an expired signer enrollment,
# matching the peer-side verify_quorum_with_signers — itself a descendant of
# c9820799 (ZEB-372, harmony#277), which gave PubKeyBundle the REAL birational
# X25519 (RFC 7748 §5) for master + device bundles instead of the zeroed stub —
# EnrollmentCert.device_pubkeys.classical.x25519_pub is a usable seal target
# (butler deposits, targeted invites); identity_hash() excludes encryption keys,
# so no owner/device ids change. Cross-repo agreement is pinned by tests in
# dm_signing.rs (ZEB-372).
harmony-runtime = { git = "https://github.com/zeblithic/harmony.git", rev = "777a5c007c076d96840c9a3b012a028ea3d17a3e" }
# ZEB-548 Stage 0: identity + content are shared with harmony-core-types, so
# their rev lives in [workspace.dependencies] (single source of truth).
harmony-identity = { workspace = true }
harmony-content = { workspace = true }
harmony-core-types = { path = "crates/harmony-core-types" }
# ZEB-548 Stage 1: time/causality leaf primitives (clock_trust, hlc_adopt_floor,
# wall_clock_ms) — pure leaf, no harmony-* deps.
harmony-foundation = { path = "crates/harmony-foundation" }
# ZEB-548 Stage 1 (PR #3): identity/vault crypto + at-rest sealing +
# content-addressing leaf tier. harmony-app re-exports its modules (lib.rs) so
# the crate::identity::* / crate::content_store::* / crate::device_dataset_file::*
# / crate::avatar_blob_store::* call sites resolve unchanged.
harmony-identity-crypto = { path = "crates/harmony-identity-crypto" }
harmony-compute = { git = "https://github.com/zeblithic/harmony.git", rev = "777a5c007c076d96840c9a3b012a028ea3d17a3e" }
harmony-telemetry = { git = "https://github.com/zeblithic/harmony.git", rev = "777a5c007c076d96840c9a3b012a028ea3d17a3e" }
harmony-mailbox = { git = "https://github.com/zeblithic/harmony.git", rev = "777a5c007c076d96840c9a3b012a028ea3d17a3e" }
harmony-owner = { workspace = true, features = ["recovery"] }
# ZEB-716: direct dep for `hash::truncated_hash` — the primitive behind
# harmony-identity's device address_hash — so the community-invite wire
# commitment delegates to it instead of open-coding SHA256[..16]. Already in
# the lock transitively; the ml-dsa/ml-kem pins below exist for its benefit.
# ZEB-548 Stage 1 (PR #3): rev moved to [workspace.dependencies] (now shared with
# harmony-identity-crypto). The `password-envelope` feature stays app-side too.
harmony-crypto = { workspace = true, features = ["password-envelope"] }
# ZEB-737 (ZEB-571 item 3): harmony-crdt-sync is the reusable backfill/backoff
# latch primitive that `channel_backfill.rs` now delegates to (the drivers +
# the `Hlc` watermark binding stay client-side). ZEB-548 Stage 0: shared with
# harmony-core-types, so its rev lives in [workspace.dependencies].
harmony-crdt-sync = { workspace = true }
# ZEB-323 Phase 2b: pkarr-based discovery policies. Deliberately held at its
# OWN rev — a
# SEPARATE pin from the workspace-wide rev of
# the crates above, NOT kept in lockstep with it. Bumped independently only
# when pkarr itself needs it, so an owner/runtime bump like harmony#286 does
# not drag in unrelated pkarr changes. (The pins currently coincide at
# 777a5c0 — ZEB-963 — because no pkarr-touching commit lies beyond it.) Provenance: RelayPool/health +
# real-wire-format work (was 2aaf403b in ZEB-380 PR1 — see git history).
# test-fixtures feature is activated only for the dev-dependency below
# so MockPkarrRelay is excluded from release binaries (round-1 review fix).
harmony-pkarr = { git = "https://github.com/zeblithic/harmony.git", rev = "777a5c007c076d96840c9a3b012a028ea3d17a3e" }
# ZEB-473 (DM-over-iroh, Move 1a): harmony-tunnel is the PQ iroh tunnel crate
# that Move 1 rewires the dormant DM unicast fan-out onto. Pinned to the same
# workspace-wide rev as the crates above. Imported here in Task 1 so later
# tasks can wire it; this task only bumps the pin + clears dead Reticulum refs.
harmony-tunnel = { git = "https://github.com/zeblithic/harmony.git", rev = "777a5c007c076d96840c9a3b012a028ea3d17a3e" }
# ZEB-739 (ZEB-571 item 4, slice 1): the iroh library tier. harmony-iroh is the
# reusable iroh Endpoint wrapper (relay/rebind lifecycle) + ALPN-keyed dispatch
# seam; harmony-tunnel-iroh is the per-peer PQ TunnelManager + initiator/responder
# driver over it. iroh_endpoint.rs / tunnel_manager.rs / tunnel_task.rs delegate
# to these (the app keeps the ALPN consts, key provisioning, DeviceTunnelContact→
# TunnelPeer mapping, the CompatSink impl, and the zenoh bridge). Same lockstep
# rev as the crates above; both are the I/O-bearing (std) form.
harmony-iroh = { git = "https://github.com/zeblithic/harmony.git", rev = "777a5c007c076d96840c9a3b012a028ea3d17a3e" }
harmony-tunnel-iroh = { git = "https://github.com/zeblithic/harmony.git", rev = "777a5c007c076d96840c9a3b012a028ea3d17a3e" }
harmony-reachability = { workspace = true }
# ZEB-380: relay-URL validation (scheme + host checks) in connectivity_settings.rs.
# Already in the lock transitively (reqwest/iroh); a direct entry just makes it importable.
url = "2"
blake3 = "1"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
clap = { version = "4", features = ["derive"] }
secrecy = "0.10"
subtle = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# ZEB-379: desktop GUI tracing subscriber (rolling log file for tester diagnostics).
tracing-appender = "0.2"
# ZEB-379: handle-free app-data dir resolution for the log path (already resolved
# transitively at 6.0.0; this just makes it a direct dep).
dirs = "6"

# Pin pre-release PQ crypto deps to match the harmony workspace.
# These RC crates have breaking changes between point releases; without
# exact pins Cargo resolves to newer (incompatible) versions.
# Nothing in THIS crate uses ml-dsa/ml-kem directly — these entries exist
# only to pin resolution for harmony-crypto's benefit.
# ml-dsa: default-features = false is load-bearing (ZEB-619). Defaults
# enable ml-dsa's `pkcs8` feature, whose shim is source-incompatible with
# the pkcs8 0.11 FINAL that iroh 1.0.1's ed25519 tier forces into the
# lock; every ml-dsa new enough to fix it drops the sha3-rc XOF path the
# harmony workspace's keccak =0.2.0-rc.2 pin depends on. With defaults
# off, feature unification leaves harmony-crypto's set (rand_core,
# zeroize) — the same surface harmony's own workspace builds — and the
# broken shim (plus its pkcs8 dependency edge) is never compiled.
ml-dsa = { version = "=0.1.0-rc.7", default-features = false }
ml-kem = "=0.3.0-rc.0"
sha3 = "=0.11.0-rc.8"
keccak = "=0.2.0-rc.2"

curve25519-dalek = "=4.1.3"
merlin = "3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
async-trait = "0.1"
base64 = "0.22"
# ZEB-948: raw-DEFLATE compression of the community-invite URL body. Default
# features use the pure-Rust miniz_oxide backend (no C/zlib dependency).
flate2 = "1"
thiserror = "1"
tempfile = "3"
rusqlite = { version = "0.31", features = ["bundled"] }
rust_decimal = "1"
csv = "1"
chrono = "0.4"
frost-ristretto255 = { version = "3.0.0", features = ["serde"] }
# ZEB-321 Phase 1 Task 4 (upgraded ZEB-619): iroh endpoint used by the
# zenoh-over-iroh transport and the harmony device handshakes. Pinned at
# 1.0 (wire-frozen major: any v1.x endpoint interoperates with any other
# v1.x; v1 CANNOT talk to v0.98 — fleet upgrades are flag-day). The
# harmony-* workspace crates we depend on do NOT pull iroh transitively
# (verified 2026-07-01), so we have free choice of version. MSRV floor
# 1.91 comes from this crate.
iroh = "1.0"
# ZEB-321 Phase 1 Task 7: network-interface change watcher used by
# `reachability_publisher` to debounce republishes on IP / link
# transitions. `if-watch` v3 exposes its tokio adapter via
# `if_watch::tokio::IfWatcher`, which implements
# `Stream<Item = std::io::Result<IfEvent>>` — we drive it via
# `futures::StreamExt::next()` (no manual `poll_fn` wrapping needed).
if-watch = { version = "3", features = ["tokio"] }
# ZEB-391: one-shot host interface enumeration (name + assigned IP) used by
# `direct_addr_filter` to drop stale/virtual addresses from the advertised iroh
# direct-address set. Already in the lock transitively (via if-watch); a direct
# entry just makes `if_addrs::get_if_addrs()` importable.
if-addrs = "0.15"
tauri-plugin-fs = "2.5.1"
# ZEB-445 API control surface: axum hosts the localhost HTTP+WS control
# surface (already in the lock via harmony-pkarr's dev-only test-fixtures;
# this entry promotes it to a production dep). fd-lock provides the OS
# advisory one-node-per-profile lock (released automatically on process
# death, so stale-lock reclaim needs no PID-liveness logic).
axum = { version = "0.8", features = ["ws"] }
fd-lock = "4"
# ZEB-452 `harmony-app api` CLI client: reqwest for the one-shot RPC POST,
# tokio-tungstenite for the events stream. TLS-free on purpose — the API
# is loopback-only HTTP by design (spec §Auth).
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

[dev-dependencies]
serial_test = "3"
# ZEB-329: regex used in network_health redaction-leak test to assert
# no 32+ char hex run leaks into the redacted export markdown.
regex = "1"
# ZEB-626: direct dev-dep so the guard test can assert the vendored patch
# is active (resolved to vendor/netdev by the [patch.crates-io] entry).
netdev = "0.45.0"
# tempfile is declared in [dependencies] (production code uses NamedTempFile
# for atomic writes — connectivity_settings, mint, file_stream_crypto, …; the
# save_atomically primitive itself moved to harmony-foundation in ZEB-548
# Stage 1). cargo already makes it available to tests, so a [dev-dependencies]
# entry would be redundant and would misleadingly suggest test-only usage.
tauri = { version = "2", features = ["test"] }
# ZEB-445: "io-util" gives the api/mod.rs unit tests AsyncRead/WriteExt for
# their raw-TcpStream HTTP client (no HTTP-client dev-dep needed).
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "test-util", "io-util"] }
# Activate test-fixtures feature for harmony-pkarr in dev/test builds only,
# so MockPkarrRelay (an axum HTTP server) is excluded from release binaries.
harmony-pkarr = { git = "https://github.com/zeblithic/harmony.git", rev = "777a5c007c076d96840c9a3b012a028ea3d17a3e", features = ["test-fixtures"] }
# ZEB-880 round 2: direct dev-dep (same version + features harmony-pkarr pins)
# so the reachability_bound boundary test can pin MAX_RECORD_CBOR_BYTES to
# pkarr's REAL build-time gate (the 1000-byte encoded-DNS-packet check) by
# replicating harmony-pkarr's wire packet assembly against the actual builder.
pkarr = { version = "3.10.0", default-features = false, features = ["signed_packet"] }

# ZEB-156: harmony-runtime (pinned above) provides the narrow
# `NodeRuntime::remove_content` + `StorageTier::remove` delegates this
# branch's Burn arm uses, with the is_pinned guard on remove() that protects
# the pin-retention contract.

# Slim debug profile (ZEB-304 secondary speedup). Full DWARF (debug = 2) inflates
# each test binary by ~10x and dramatically increases link wall-clock on macOS
# (where ld64 dedupes symbols across every dependent binary). "line-tables-only"
# preserves file:line in backtraces — what we actually need for cargo test
# failures — at a fraction of the size. Devs who need richer debugger state
# (variable inspection, type names) can override locally via
# `CARGO_PROFILE_DEV_DEBUG=2 cargo build`.
[profile.dev]
debug = "line-tables-only"

# ZEB-368: vendored fork of zenoh-link 1.9.0 that teaches Zenoh's closed
# locator→transport dispatch about the `iroh/<hex>` scheme (zenoh 1.9.0 exposes
# no public/internal API to register a custom unicast transport — the LinkKind
# enum + LinkManagerBuilderUnicast::make are a closed match). `[patch]` replaces
# the crate graph-wide, so zenoh-transport's own dispatch compiles against our
# copy. See docs/specs/2026-06-02-zeb-321-phase2-zenoh-over-iroh-ingestion-design.md.
[patch.crates-io]
zenoh-link = { path = "vendor/zenoh-link" }
# netdev (ZEB-626): upstream 0.45.0 queries the WiFi transmit rate via a
# synchronous CoreWLAN->wifid XPC call during interface enumeration; for
# unentitled processes (every test binary) that stalls ~60s, and it runs
# inside the first iroh Endpoint::bind() of every process via netwatch.
# Nothing consumes the field. The vendored copy sets transmit_speed = None
# on macOS; see vendor/netdev/README.zeblithic.md for provenance, the
# guard test, and the version-upkeep rule. Upstream asks live in ZEB-632
# (dossier only — no upstream contact).
netdev = { path = "vendor/netdev" }
