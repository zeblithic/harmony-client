[package]
name = "harmony-app"
version = "0.1.0"
description = "Harmony Network Client"
authors = ["zeblithic"]
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
# Default features include TCP, UDP, QUIC, TLS, WebSocket transports.
# A desktop app benefits from all transports. Disabling defaults breaks
# TCP connectivity (previous review confirmed this).
zenoh = "1"
tokio = { version = "1", features = ["rt", "net", "time", "sync"] }
tauri-plugin-dialog = "2"
futures = "0.3"
hex = "0.4"
rand = "0.8"
zeroize = "1"
tracing = "0.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Harmony crates — harmony-runtime is the core sans-I/O runtime.
# harmony-identity and harmony-content are direct deps because we use
# their types (PrivateIdentity, PqPrivateIdentity, MemoryBookStore, etc.).
harmony-runtime = { git = "https://github.com/zeblithic/harmony.git", branch = "main" }
harmony-identity = { git = "https://github.com/zeblithic/harmony.git", branch = "main" }
harmony-content = { git = "https://github.com/zeblithic/harmony.git", branch = "main" }
harmony-compute = { git = "https://github.com/zeblithic/harmony.git", branch = "main" }
harmony-telemetry = { git = "https://github.com/zeblithic/harmony.git", branch = "main" }
harmony-mailbox = { git = "https://github.com/zeblithic/harmony.git", branch = "main" }
harmony-owner = { git = "https://github.com/zeblithic/harmony.git", branch = "main", features = ["recovery"] }
blake3 = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
secrecy = "0.10"
subtle = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Pin pre-release PQ crypto deps to match the harmony workspace.
# These RC crates have breaking changes between point releases; without
# exact pins Cargo resolves to newer (incompatible) versions.
ml-dsa = "=0.1.0-rc.7"
ml-kem = "=0.3.0-rc.0"
sha3 = "=0.11.0-rc.8"
keccak = "=0.2.0-rc.2"

ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
async-trait = "0.1"

[dev-dependencies]
serial_test = "3"
tempfile = "3"
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
