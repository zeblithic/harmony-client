[package]
name = "harmony-app"
version = "0.1.0"
description = "Harmony Network Client"
authors = ["zeblithic"]
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# `test-fixtures` exposes test-only helpers (deterministic-nonce
# encrypt, etc.) to integration tests in `tests/*.rs`. Integration
# tests compile against the crate's public API, so `#[cfg(test)]`
# alone won't reach them — that gate only fires for inside-the-crate
# tests. Helpers gated on `test-fixtures` are physically excluded from
# release builds; the CI lib + workspace cargo invocations enable the
# feature to keep wire-format pin tests compilable. NEVER enable in a
# production build — see `community_channel_log::encrypt_channel_packet_with_nonce`
# for the nonce-reuse footgun this gate guards.
test-fixtures = []

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
serde_bytes = "0.11"
ciborium = "0.2"
# Default features include TCP, UDP, QUIC, TLS, WebSocket transports.
# A desktop app benefits from all transports. Disabling defaults breaks
# TCP connectivity (previous review confirmed this).
zenoh = "1"
# ZEB-321 Phase 1 Task 5: zenoh's pluggable transport surface lives in
# zenoh-link (LinkUnicastTrait, LinkAuthId, BatchSize, Locator) and
# zenoh-result (ZResult, zerror!). Both are transitive deps of zenoh
# itself, but cargo requires an explicit entry to import from them
# directly. Pinned to "1" to track zenoh's major version; resolves
# to the same versions Cargo.lock pins for the transitive copies.
zenoh-link = "1"
zenoh-result = "1"
# Needed for `BatchSize` (used in `LinkUnicastTrait::get_mtu`'s return
# type). `BatchSize` is `pub type BatchSize = u16` in zenoh-protocol's
# transport module — zenoh-link does not re-export it, so we depend on
# zenoh-protocol directly.
zenoh-protocol = "1"
# ZEB-321 Phase 1 Task 6: `NewLinkChannelSender = flume::Sender<LinkUnicast>`
# is zenoh-link's outbound-new-link mechanism (see
# `zenoh-link-commons::unicast`). Constructing `IrohZenohLinkManager`
# requires a flume sender, so we pull `flume` in directly rather than
# leaning on the transitive copy zenoh re-exports privately. Pinned to
# "0.11" — matches the version zenoh-link-commons 1.8 resolves to.
flume = "0.11"
tokio = { version = "1", features = ["rt", "net", "time", "sync"] }
tauri-plugin-dialog = "2"
futures = "0.3"
hex = "0.4"
rand = "0.8"
rand_chacha = "0.3"
zeroize = { version = "1", features = ["derive"] }
ulid = { version = "1", features = ["serde"] }
tracing = "0.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Harmony crates — harmony-runtime is the core sans-I/O runtime.
# harmony-identity and harmony-content are direct deps because we use
# their types (PrivateIdentity, PqPrivateIdentity, MemoryBookStore, etc.).
harmony-runtime = { git = "https://github.com/zeblithic/harmony.git", rev = "04449d603c042c121ee9836ebd244310adaf7f6a" }
harmony-identity = { git = "https://github.com/zeblithic/harmony.git", rev = "04449d603c042c121ee9836ebd244310adaf7f6a" }
harmony-content = { git = "https://github.com/zeblithic/harmony.git", rev = "04449d603c042c121ee9836ebd244310adaf7f6a" }
harmony-compute = { git = "https://github.com/zeblithic/harmony.git", rev = "04449d603c042c121ee9836ebd244310adaf7f6a" }
harmony-telemetry = { git = "https://github.com/zeblithic/harmony.git", rev = "04449d603c042c121ee9836ebd244310adaf7f6a" }
harmony-mailbox = { git = "https://github.com/zeblithic/harmony.git", rev = "04449d603c042c121ee9836ebd244310adaf7f6a" }
harmony-owner = { git = "https://github.com/zeblithic/harmony.git", rev = "04449d603c042c121ee9836ebd244310adaf7f6a", features = ["recovery"] }
# ZEB-323 Phase 2b: pkarr-based discovery policies. Pinned to the PR #270 merge
# commit on harmony main (zeb-322 squash). test-fixtures feature is activated
# only for dev-dependencies below so MockPkarrRelay is excluded from release
# binaries (round-1 review fix).
harmony-pkarr = { git = "https://github.com/zeblithic/harmony", rev = "6ac9b989d64a1e5ae13e860f63a8423cd05dc5ca" }
blake3 = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
secrecy = "0.10"
subtle = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Pin pre-release PQ crypto deps to match the harmony workspace.
# These RC crates have breaking changes between point releases; without
# exact pins Cargo resolves to newer (incompatible) versions.
ml-dsa = "=0.1.0-rc.7"
ml-kem = "=0.3.0-rc.0"
sha3 = "=0.11.0-rc.8"
keccak = "=0.2.0-rc.2"

curve25519-dalek = "=4.1.3"
merlin = "3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
async-trait = "0.1"
base64 = "0.22"
thiserror = "1"
tempfile = "3"
rusqlite = { version = "0.31", features = ["bundled"] }
rust_decimal = "1"
csv = "1"
chrono = "0.4"
frost-ristretto255 = { version = "3.0.0", features = ["serde"] }
# ZEB-321 Phase 1 Task 4: iroh endpoint used by the upcoming
# zenoh-over-iroh transport and the harmony device handshake. Version
# pinned at 0.98 (latest stable as of 2026-05). The harmony-* workspace
# crates we depend on do NOT pull iroh transitively (verified upstream),
# so we have free choice of version. Note the 0.98 API surface differs
# from the plan's draft (NodeId→EndpointId, builder takes a Preset, etc);
# adaptations are documented in `src/iroh_endpoint.rs`.
iroh = "0.98"
# ZEB-321 Phase 1 Task 7: network-interface change watcher used by
# `reachability_publisher` to debounce republishes on IP / link
# transitions. `if-watch` v3 exposes its tokio adapter via
# `if_watch::tokio::IfWatcher`, which implements
# `Stream<Item = std::io::Result<IfEvent>>` — we drive it via
# `futures::StreamExt::next()` (no manual `poll_fn` wrapping needed).
if-watch = { version = "3", features = ["tokio"] }

[dev-dependencies]
serial_test = "3"
# tempfile is declared in [dependencies] (used by save_atomically); cargo
# already makes it available to tests, so a [dev-dependencies] entry would
# be redundant and would misleadingly suggest test-only usage.
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "test-util"] }
# Activate test-fixtures feature for harmony-pkarr in dev/test builds only,
# so MockPkarrRelay (an axum HTTP server) is excluded from release binaries.
harmony-pkarr = { git = "https://github.com/zeblithic/harmony", rev = "6ac9b989d64a1e5ae13e860f63a8423cd05dc5ca", features = ["test-fixtures"] }

# ZEB-156: the rev above (04449d60) is harmony main after PR #269 merged
# — it includes the narrow `NodeRuntime::remove_content` +
# `StorageTier::remove` delegates this branch's Burn arm uses, with the
# is_pinned guard on remove() that protects the pin-retention contract.

# Slim debug profile (ZEB-304 secondary speedup). Full DWARF (debug = 2) inflates
# each test binary by ~10x and dramatically increases link wall-clock on macOS
# (where ld64 dedupes symbols across every dependent binary). "line-tables-only"
# preserves file:line in backtraces — what we actually need for cargo test
# failures — at a fraction of the size. Devs who need richer debugger state
# (variable inspection, type names) can override locally via
# `CARGO_PROFILE_DEV_DEBUG=2 cargo build`.
[profile.dev]
debug = "line-tables-only"
