[package]
name = "harmony-app"
version = "0.1.0"
description = "Harmony Network Client"
authors = ["zeblithic"]
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# `test-fixtures` exposes test-only helpers (deterministic-nonce
# encrypt, etc.) to integration tests in `tests/*.rs`. Integration
# tests compile against the crate's public API, so `#[cfg(test)]`
# alone won't reach them — that gate only fires for inside-the-crate
# tests. Helpers gated on `test-fixtures` are physically excluded from
# release builds; the CI lib + workspace cargo invocations enable the
# feature to keep wire-format pin tests compilable. NEVER enable in a
# production build — see `community_channel_log::encrypt_channel_packet_with_nonce`
# for the nonce-reuse footgun this gate guards.
test-fixtures = []

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
serde_bytes = "0.11"
ciborium = "0.2"
# Default features include TCP, UDP, QUIC, TLS, WebSocket transports.
# A desktop app benefits from all transports. Disabling defaults breaks
# TCP connectivity (previous review confirmed this).
zenoh = "1"
tokio = { version = "1", features = ["rt", "net", "time", "sync"] }
tauri-plugin-dialog = "2"
futures = "0.3"
hex = "0.4"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
ulid = { version = "1", features = ["serde"] }
tracing = "0.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Harmony crates — harmony-runtime is the core sans-I/O runtime.
# harmony-identity and harmony-content are direct deps because we use
# their types (PrivateIdentity, PqPrivateIdentity, MemoryBookStore, etc.).
harmony-runtime = { git = "https://github.com/zeblithic/harmony.git", rev = "be429fb40c3b11b4bd37ffcf707c0e6a5b647bbb" }
harmony-identity = { git = "https://github.com/zeblithic/harmony.git", rev = "be429fb40c3b11b4bd37ffcf707c0e6a5b647bbb" }
harmony-content = { git = "https://github.com/zeblithic/harmony.git", rev = "be429fb40c3b11b4bd37ffcf707c0e6a5b647bbb" }
harmony-compute = { git = "https://github.com/zeblithic/harmony.git", rev = "be429fb40c3b11b4bd37ffcf707c0e6a5b647bbb" }
harmony-telemetry = { git = "https://github.com/zeblithic/harmony.git", rev = "be429fb40c3b11b4bd37ffcf707c0e6a5b647bbb" }
harmony-mailbox = { git = "https://github.com/zeblithic/harmony.git", rev = "be429fb40c3b11b4bd37ffcf707c0e6a5b647bbb" }
harmony-owner = { git = "https://github.com/zeblithic/harmony.git", rev = "be429fb40c3b11b4bd37ffcf707c0e6a5b647bbb", features = ["recovery"] }
blake3 = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
secrecy = "0.10"
subtle = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Pin pre-release PQ crypto deps to match the harmony workspace.
# These RC crates have breaking changes between point releases; without
# exact pins Cargo resolves to newer (incompatible) versions.
ml-dsa = "=0.1.0-rc.7"
ml-kem = "=0.3.0-rc.0"
sha3 = "=0.11.0-rc.8"
keccak = "=0.2.0-rc.2"

curve25519-dalek = "=4.1.3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
async-trait = "0.1"
base64 = "0.22"
thiserror = "1"
tempfile = "3"
frost-ristretto255 = { version = "3.0.0", features = ["serde"] }

[dev-dependencies]
serial_test = "3"
# tempfile is declared in [dependencies] (used by save_atomically); cargo
# already makes it available to tests, so a [dev-dependencies] entry would
# be redundant and would misleadingly suggest test-only usage.
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "test-util"] }

