# Nextest config — see https://nexte.st/docs/configuration/
#
# (Historical) PR #166 quarantined 17 tests via a `[profile.default]`
# `default-filter` after CI was re-enabled on 2026-05-13. None were
# production bugs — all 17 were test-infrastructure issues, now fixed
# (ZEB-332), so the quarantine filter has been removed and the full suite
# runs in CI again:
#
#   - 12 dot-prefixed-tempdir-root tests (3 `folder_ingest` unit + 9
#     `folder_ingest_walker_integration`): `tempfile::tempdir()`'s default
#     `.tmp<rand>` basename was rejected by `should_filter_name` at the
#     walk-root guard, so the walk saw no files. Fixed by building a
#     non-dot-prefixed walk root via a `walk_root_tempdir` helper. (The
#     original inventory mis-bucketed the 9 walker tests as ACL failures;
#     direct repro showed they never reach the IPC ACL gate.)
#   - 5 Tauri 2.11 ACL-drift IPC tests (`get_ipc_response` roundtrips):
#     `mock_context(noop_assets())` ships an empty ACL and the request URL
#     was the Windows-only local form, so the webview IPC gate denied the
#     command. Fixed with the `harmony_app::mock_context_with_full_acl`
#     fixture (pre-allows the invoked commands) plus `harmony_app::LOCAL_IPC_URL`
#     (the Linux/macOS `tauri://localhost` origin so the call is treated as
#     local).
#
# No profile config is needed today; this file is kept as the home for any
# future nextest configuration.

# ZEB-619 (iroh 0.98.2 -> 1.0.1): iroh 1.0 moved endpoint drain off the
# awaited close() path onto Drop, so every hermetic test process pays a
# ~57s background teardown (netwatch blocking socket-close + per-endpoint
# netmon monitor) AFTER its test body finishes. Under nextest's default
# full-CPU parallelism those drains contend and serialize into a
# ~330-360s-per-test plateau (54min suite, one outer-timeout failure).
# Capping concurrency for endpoint-heavy tests keeps the drains from
# stampeding; the ~57s/process floor itself is upstream behavior — a
# follow-up ticket tracks cutting it (endpoint pool or an iroh knob).
[test-groups]
iroh-endpoint = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'test(iroh) | test(zenoh) | test(tunnel) | test(reachability) | test(dial) | binary(~iroh) | binary(~zenoh) | binary(~referral) | binary(~network_health) | binary(~friend_token) | binary(~open_join)'
test-group = 'iroh-endpoint'
