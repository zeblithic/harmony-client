# harmony-mail — ZEB-548 Stage 1 (PR #6).
# The mail store + mail-sync engine leaf, extracted from harmony-app. Depends
# only downward: harmony-foundation (node_event_sink), harmony-identity-crypto
# (device_dataset_file / recoverable_load), harmony-runtime-ipc (FetchRequest),
# harmony-mailbox (message wire types), plus third-party primitives. No Tauri,
# no back-reference to harmony-app; harmony-app re-exports its modules so the
# crate::mail::* / crate::mail_sync::* call paths across the binary resolve
# unchanged.
[package]
name = "harmony-mail"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[lib]
name = "harmony_mail"

[features]
# Mirrors the sibling leaves: forwards to the crypto/emission fixtures the mail
# tests use (device_dataset_file::test_cipher, node_event_sink::RecordingSink).
# The dev-dependencies below cover the default `cargo test -p harmony-mail` path;
# this feature covers `--features test-fixtures` (workspace clippy / --all-targets).
test-fixtures = [
    "harmony-foundation/test-fixtures",
    "harmony-identity-crypto/test-fixtures",
]

[dependencies]
harmony-foundation = { path = "../harmony-foundation" }
harmony-identity-crypto = { path = "../harmony-identity-crypto" }
harmony-runtime-ipc = { path = "../harmony-runtime-ipc" }
harmony-mailbox = { workspace = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "io-util"] }
tracing = "0.1"
hex = "0.4"
blake3 = "1"
futures = "0.3"

[dev-dependencies]
harmony-foundation = { path = "../harmony-foundation", features = ["test-fixtures"] }
harmony-identity-crypto = { path = "../harmony-identity-crypto", features = ["test-fixtures"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "test-util", "io-util"] }
