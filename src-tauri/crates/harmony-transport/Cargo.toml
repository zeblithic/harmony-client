# ZEB-548 Stage 2 (ZEB-990): the transport/dm/owner spine, extracted from
# harmony-app as ONE coarse crate. Dependency entries mirror harmony-app's
# (same versions/features) so the workspace resolves one graph; harmony-* git
# revs come from [workspace.dependencies] for lockstep.
[package]
name = "harmony-transport"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[features]
# Mirrors harmony-app's gate: exposes deterministic/test-only seams in this
# crate and forwards the gate to the member crates whose fixtures the moved
# modules' tests reach (RecordingSink, quorum_fixtures, test ciphers). NEVER
# enable in a production build.
test-fixtures = [
    "harmony-core-types/test-fixtures",
    "harmony-foundation/test-fixtures",
    "harmony-identity-crypto/test-fixtures",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
ciborium = "0.2"
zenoh = { version = "=1.9.0", features = ["internal", "unstable"] }
zenoh-link = "1"
zenoh-result = "1"
zenoh-protocol = "1"
flume = "0.11"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "signal", "io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
hex = "0.4"
rand = "0.8"
rand_chacha = "0.3"
zeroize = { version = "1", features = ["derive"] }
ulid = { version = "1", features = ["serde"] }
tracing = "0.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
blake3 = "1"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
secrecy = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
async-trait = "0.1"
thiserror = "1"
# Production dep (atomic-write temp files), matching harmony-app's placement.
tempfile = "3"
iroh = "1.0"

harmony-identity = { workspace = true }
harmony-content = { workspace = true }
harmony-owner = { workspace = true, features = ["recovery"] }
harmony-crypto = { workspace = true }
harmony-crdt-sync = { workspace = true }
harmony-reachability = { workspace = true }
harmony-pkarr = { git = "https://github.com/zeblithic/harmony.git", rev = "777a5c007c076d96840c9a3b012a028ea3d17a3e" }
harmony-iroh = { git = "https://github.com/zeblithic/harmony.git", rev = "777a5c007c076d96840c9a3b012a028ea3d17a3e" }
harmony-tunnel-iroh = { git = "https://github.com/zeblithic/harmony.git", rev = "777a5c007c076d96840c9a3b012a028ea3d17a3e" }

harmony-core-types = { path = "../harmony-core-types" }
harmony-foundation = { path = "../harmony-foundation" }
harmony-identity-crypto = { path = "../harmony-identity-crypto" }

[dev-dependencies]
serial_test = "3"
regex = "1"
# ZEB-626: the vendored-netdev guard test moved here with iroh_endpoint.rs
# (resolved to vendor/netdev by the workspace-root [patch.crates-io] entry).
netdev = "0.45.0"
# Same default-feature-test-path pattern as harmony-app (ZEB-548 Stage 1 PR #4):
# a bare `cargo test -p harmony-transport --lib` must reach the member crates'
# test-fixtures-gated seams without `--features`.
harmony-core-types = { path = "../harmony-core-types", features = ["test-fixtures"] }
harmony-foundation = { path = "../harmony-foundation", features = ["test-fixtures"] }
harmony-identity-crypto = { path = "../harmony-identity-crypto", features = ["test-fixtures"] }
harmony-pkarr = { git = "https://github.com/zeblithic/harmony.git", rev = "777a5c007c076d96840c9a3b012a028ea3d17a3e", features = ["test-fixtures"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "test-util", "io-util"] }
